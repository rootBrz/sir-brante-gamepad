name: ci
# Every push and pull request is built. A push to main also publishes a GitHub release named after the
# <Version> in Brante.Gamepad.csproj, unless a release for that version already exists (bump the version to cut a new one).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: version
        run: echo "version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Brante.Gamepad.csproj | head -n 1)" >> "$GITHUB_OUTPUT"
      # Logic checks, then a build against public NuGet packages (no game files needed).
      - run: tools/build.sh all
      - uses: actions/upload-artifact@v4
        with:
          name: SirBrante.Gamepad
          path: release/*.zip
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SirBrante.Gamepad
      - name: Publish release for this version
        run: |
          TAG="v${{ needs.build.outputs.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; bump <Version> in Brante.Gamepad.csproj to publish a new one."
            exit 0
          fi
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$TAG" *.zip SHA256SUMS.txt --target "$GITHUB_SHA" --title "$TAG" --generate-notes
